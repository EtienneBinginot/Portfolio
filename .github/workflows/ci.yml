name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality-gate:
    name: Format, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Prettier
        run: npm run format:check

      - name: ESLint
        run: npm run lint

      - name: Vitest
        run: npm test

      - name: Build (includes data.*.json schema validation)
        run: npm run build
